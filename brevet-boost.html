 */const $f=re("Zap",[["path",{d:"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z",key:"1xq2db"}]]),wt=[{id:"francais",name:"Français",short:"Français",icon:Os,gradient:"from-rose-500 to-pink-500",soft:"bg-rose-50 text-rose-700 border-rose-200",accent:"text-rose-600",sheets:[{id:"fr-figures",title:"Les figures de style",intro:"Une figure de style est un procédé d’écriture qui rend le discours plus expressif. Au Brevet, il faut savoir la nommer ET expliquer son effet.",points:[{h:"Comparaison",t:"Rapproche deux éléments grâce à un outil de comparaison (comme, tel, pareil à, ressembler…). Ex. : « Ses yeux brillaient comme des étoiles. »"},{h:"Métaphore",t:"Comparaison SANS outil de comparaison. Ex. : « Cette femme est une perle. »"},{h:"Personnification",t:"Attribue des caractéristiques humaines à un objet, un animal ou une idée. Ex. : « Le vent hurlait sa colère. »"},{h:"Hyperbole",t:"Exagération pour frapper l’esprit. Ex. : « Je meurs de faim. »"},{h:"Anaphore",t:"Répétition d’un même mot en début de vers ou de phrase pour insister. Ex. : « Paris outragé ! Paris brisé ! Paris martyrisé ! » (de Gaulle)"},{h:"Antithèse / Oxymore",t:"Antithèse : opposition de deux idées dans une phrase. Oxymore : deux mots contraires accolés (« cette obscure clarté » – Corneille)."},{h:"Gradation",t:"Succession de termes d’intensité croissante (ou décroissante). Ex. : « Va, cours, vole, et nous venge. » (Corneille)"},{h:"Euphémisme / Litote",t:"Euphémisme : atténuer une réalité dure (« il nous a quittés »). Litote : dire moins pour suggérer plus (« Va, je ne te hais point »)."}],retenir:"Méthode : 1) je repère la figure, 2) je la nomme, 3) j’explique l’effet produit sur le lecteur (insistance, émotion, image frappante…)."},{id:"fr-propositions",title:"Phrase complexe & propositions subordonnées",intro:"Une phrase complexe contient plusieurs verbes conjugués, donc plusieurs propositions. Les questions de grammaire du Brevet portent très souvent sur elles.",points:[{h:"Juxtaposition",t:"Propositions séparées par une ponctuation (virgule, point-virgule, deux-points). Ex. : « Il pleut, je reste. »"},{h:"Coordination",t:"Propositions reliées par une conjonction de coordination (mais, ou, et, donc, or, ni, car) ou un adverbe (puis, ensuite…)."},{h:"Subordonnée relative",t:"Introduite par un pronom relatif (qui, que, quoi, dont, où, lequel…). Elle complète un nom (l’antécédent). Fonction : complément de l’antécédent. Ex. : « Le livre que je lis est passionnant. »"},{h:"Subordonnée conjonctive complétive",t:"Introduite par « que », elle est le plus souvent COD du verbe. Ex. : « Je pense que tu réussiras. »"},{h:"Subordonnée circonstancielle",t:"Introduite par une conjonction de subordination (quand, parce que, bien que, si, afin que…). Elle exprime le temps, la cause, la conséquence, le but, la condition, la concession…"},{h:"Interrogative indirecte",t:"Introduite par si, qui, quand, comment, pourquoi… après un verbe comme demander, savoir. Ex. : « Je me demande s’il viendra. »"}],retenir:"Astuce : compte les verbes conjugués = nombre de propositions. Puis regarde le mot qui introduit chaque proposition pour l’identifier."},{id:"fr-temps",title:"Valeurs des temps du récit et du discours",intro:"Savoir pourquoi l’auteur utilise un temps plutôt qu’un autre est une question classique de l’épreuve de compréhension.",points:[{h:"Présent",t:"Énonciation (moment où l’on parle), vérité générale (« La Terre tourne autour du Soleil »), habitude, présent de narration (rend une action passée plus vivante)."},{h:"Imparfait",t:"Arrière-plan du récit : descriptions, actions longues ou répétées, habitudes dans le passé. Ex. : « Chaque matin, il partait tôt. »"},{h:"Passé simple",t:"Premier plan : actions brèves, ponctuelles, qui font avancer l’histoire. Ex. : « Soudain, la porte s’ouvrit. »"},{h:"Plus-que-parfait",t:"Action antérieure à une autre action passée. Ex. : « Il avait déjà mangé quand elle arriva. »"},{h:"Conditionnel",t:"Futur dans le passé, hypothèse (« si j’avais le temps, je viendrais »), politesse, information non vérifiée."},{h:"Subjonctif",t:"Exprime le souhait, l’ordre, le doute, le sentiment. S’emploie après « il faut que », « bien que », « pour que »…"}],retenir:"Le couple imparfait / passé simple structure le récit : l’imparfait pose le décor, le passé simple fait avancer l’action."},{id:"fr-redaction",title:"Réussir la rédaction",intro:"La rédaction est notée sur 40 points environ (sur 100 en français). Deux sujets au choix : imagination ou réflexion.",points:[{h:"Analyser le sujet",t:"Souligne les mots-clés : type de texte (récit, lettre, dialogue, argumentation), point de vue (1re/3e personne), temps imposés, contraintes de longueur."},{h:"Sujet d’imagination",t:"Respecte le cadre du texte étudié (époque, personnages, temps). Varie les types de phrases, intègre description, dialogue, sentiments et figures de style."},{h:"Sujet de réflexion",t:"Introduction (amorce + problématique + annonce du plan), 2 ou 3 parties avec arguments + exemples précis (lectures, films, histoire), conclusion (bilan + ouverture)."},{h:"Les connecteurs",t:"Tout d’abord, de plus, en outre, cependant, néanmoins, par conséquent, ainsi, enfin, en conclusion… Ils rendent ton raisonnement clair."},{h:"Se relire",t:"Garde 10 minutes pour vérifier accords (sujet-verbe, participes passés), homophones (a/à, et/est, ces/ses), ponctuation."}],retenir:"Brouillon = plan + idées clés, pas tout le texte ! Rédige directement au propre après 15–20 min de préparation."}],quiz:[{q:"« Ce lac est un miroir. » Quelle figure de style est employée ?",o:["Comparaison","Métaphore","Personnification","Hyperbole"],a:1,e:"C’est une métaphore : on rapproche le lac et le miroir SANS outil de comparaison (pas de « comme », « tel »…)."},{q:"« Cette obscure clarté qui tombe des étoiles » (Corneille) contient :",o:["Une anaphore","Une litote","Un oxymore","Une gradation"],a:2,e:"« Obscure clarté » associe deux termes contradictoires directement accolés : c’est un oxymore."},{q:"Dans « Le roman que tu m’as prêté est génial », la proposition « que tu m’as prêté » est :",o:["Une subordonnée conjonctive","Une subordonnée relative","Une proposition indépendante","Une interrogative indirecte"],a:1,e:"« que » est ici un pronom relatif qui reprend l’antécédent « roman » : c’est une subordonnée relative, complément de l’antécédent."},{q:"Quelle est la valeur du présent dans « L’eau bout à 100 °C » ?",o:["Présent de narration","Présent d’habitude","Présent de vérité générale","Présent d’énonciation"],a:2,e:"Il s’agit d’une vérité toujours valable, quel que soit le moment : c’est le présent de vérité générale."},{q:"Dans un récit au passé, l’imparfait sert surtout à :",o:["Exprimer des actions brèves qui font avancer l’histoire","Décrire le décor et les actions d’arrière-plan","Exprimer un ordre","Parler du futur"],a:1,e:"L’imparfait est le temps de l’arrière-plan (descriptions, habitudes, actions longues). Le passé simple, lui, sert au premier plan."},{q:"« Je me demande s’il viendra demain. » La proposition soulignée est :",o:["Une circonstancielle de condition","Une interrogative indirecte","Une relative","Une juxtaposée"],a:1,e:"Après le verbe « se demander », « si » introduit une interrogative indirecte (la question directe serait : « Viendra-t-il demain ? »)."},{q:"« Va, je ne te hais point » (Corneille) est un exemple de :",o:["Litote","Euphémisme","Hyperbole","Antithèse"],a:0,e:"Chimène dit moins pour suggérer plus : « je ne te hais point » signifie « je t’aime ». C’est une litote."},{q:"Quelle conjonction introduit une subordonnée circonstancielle de concession ?",o:["Parce que","Afin que","Bien que","Dès que"],a:2,e:"« Bien que » (comme « quoique ») exprime la concession, toujours suivi du subjonctif. « Parce que » = cause, « afin que » = but, « dès que » = temps."},{q:"Dans un sujet de réflexion, l’introduction doit contenir :",o:["Uniquement la conclusion","Une amorce, la problématique et l’annonce du plan","Tous les arguments détaillés","Un dialogue"],a:1,e:"Une bonne introduction : une amorce (accroche), la problématique (la question posée) et l’annonce du plan."},{q:"« Va, cours, vole, et nous venge » est un exemple de :",o:["Gradation","Oxymore","Métaphore","Euphémisme"],a:0,e:"Les verbes sont de plus en plus intenses (aller → courir → voler) : c’est une gradation ascendante."}]},{id:"maths",name:"Mathématiques",short:"Maths",icon:tc,gradient:"from-blue-500 to-indigo-500",soft:"bg-blue-50 text-blue-700 border-blue-200",accent:"text-blue-600",sheets:[{id:"ma-pythagore",title:"Théorème de Pythagore",intro:"Il concerne uniquement les triangles RECTANGLES. Il permet de calculer une longueur ou de prouver qu’un triangle est (ou n’est pas) rectangle.",points:[{h:"Le théorème",t:"Si ABC est rectangle en A, alors BC² = AB² + AC² (BC est l’hypoténuse, le plus grand côté, en face de l’angle droit)."},{h:"Calculer l’hypoténuse",t:"AB = 3 cm, AC = 4 cm, rectangle en A : BC² = 9 + 16 = 25 donc BC = √25 = 5 cm."},{h:"Calculer un autre côté",t:"BC = 10, AB = 6 : AC² = BC² − AB² = 100 − 36 = 64 donc AC = 8."},{h:"La réciproque",t:"Si BC² = AB² + AC² (avec BC le plus grand côté), alors le triangle est rectangle en A."},{h:"La contraposée",t:"Si BC² ≠ AB² + AC², alors le triangle N’EST PAS rectangle."}],retenir:"Rédaction type : « Dans le triangle ABC rectangle en A, d’après le théorème de Pythagore : BC² = AB² + AC² »… puis le calcul."},{id:"ma-thales",title:"Théorème de Thalès",intro:"Il s’applique à deux droites sécantes coupées par deux droites PARALLÈLES (configuration « triangles emboîtés » ou « papillon »).",points:[{h:"Le théorème",t:"Si les droites (BM) et (CN) sont sécantes en A et si (MN) // (BC), alors AM/AB = AN/AC = MN/BC."},{h:"Exemple",t:"AM = 3, AB = 9, BC = 12 et (MN)//(BC). Alors MN/12 = 3/9, donc MN = 12 × 3 ÷ 9 = 4."},{h:"La réciproque",t:"Si AM/AB = AN/AC et si les points A, M, B et A, N, C sont alignés dans le même ordre, alors (MN) // (BC)."},{h:"La contraposée",t:"Si AM/AB ≠ AN/AC, alors les droites (MN) et (BC) ne sont pas parallèles."},{h:"Agrandissement / réduction",t:"Les triangles AMN et ABC sont proportionnels. Si les longueurs sont multipliées par k, les aires sont multipliées par k² et les volumes par k³."}],retenir:"Pythagore → triangle rectangle. Thalès → droites parallèles. Repère bien l’information donnée par l’énoncé !"},{id:"ma-trigo",title:"Trigonométrie",intro:"Dans un triangle rectangle, elle relie les angles aigus et les longueurs des côtés.",points:[{h:"SOH CAH TOA",t:"Sinus = Opposé / Hypoténuse ; Cosinus = Adjacent / Hypoténuse ; Tangente = Opposé / Adjacent."},{h:"Calculer une longueur",t:"Triangle rectangle en B, angle Â = 30°, AC = 10 (hypoténuse). BC (opposé) = 10 × sin(30°) = 10 × 0,5 = 5."},{h:"Calculer un angle",t:"On utilise les touches arccos, arcsin ou arctan (cos⁻¹, sin⁻¹, tan⁻¹) de la calculatrice, en mode DEGRÉS."},{h:"Valeurs utiles",t:"cos(60°) = 0,5 ; sin(30°) = 0,5 ; tan(45°) = 1. Le cosinus et le sinus d’un angle aigu sont toujours entre 0 et 1."}],retenir:"Vérifie TOUJOURS que ta calculatrice est en mode degrés (DEG) avant de commencer !"},{id:"ma-fonctions",title:"Fonctions linéaires et affines",intro:"Une fonction associe à un nombre x un unique nombre f(x), appelé image de x.",points:[{h:"Vocabulaire",t:"Si f(2) = 7 : 7 est l’IMAGE de 2 ; 2 est UN ANTÉCÉDENT de 7. Notation : f : x ↦ f(x)."},{h:"Fonction linéaire",t:"f(x) = ax. Représentée par une droite passant par l’origine. Elle traduit une situation de proportionnalité (a = coefficient)."},{h:"Fonction affine",t:"f(x) = ax + b. Représentée par une droite. a = coefficient directeur (pente), b = ordonnée à l’origine."},{h:"Calculer a",t:"Si la droite passe par A(x₁ ; y₁) et B(x₂ ; y₂) : a = (y₂ − y₁) / (x₂ − x₁)."},{h:"Sens de variation",t:"Si a > 0, la fonction est croissante ; si a < 0, décroissante ; si a = 0, constante."}],retenir:"Pour lire une image sur un graphique : on part de l’axe des abscisses (x) et on lit sur l’axe des ordonnées (y)."},{id:"ma-calcul",title:"Calcul littéral & équations",intro:"Développer, factoriser et résoudre des équations : des points faciles à gagner si on connaît les règles.",points:[{h:"Double distributivité",t:"(a + b)(c + d) = ac + ad + bc + bd."},{h:"Identités remarquables",t:"(a + b)² = a² + 2ab + b² ; (a − b)² = a² − 2ab + b² ; (a + b)(a − b) = a² − b²."},{h:"Factoriser",t:"Repérer un facteur commun : 3x² + 6x = 3x(x + 2). Ou utiliser a² − b² = (a − b)(a + b) : x² − 25 = (x − 5)(x + 5)."},{h:"Équation du 1er degré",t:"3x + 5 = 20 → 3x = 15 → x = 5. On isole x en faisant la même opération des deux côtés."},{h:"Équation produit nul",t:"Un produit est nul si l’un de ses facteurs est nul. (x − 2)(x + 3) = 0 ⇔ x = 2 ou x = −3."}],retenir:"Pour vérifier une solution, remplace x par la valeur trouvée dans l’équation de départ."},{id:"ma-proba",title:"Probabilités & statistiques",intro:"Questions très fréquentes au Brevet, souvent avec des urnes, des dés ou des tableaux de données.",points:[{h:"Probabilité",t:"P(A) = nombre d’issues favorables / nombre d’issues possibles (si équiprobabilité). Toujours entre 0 et 1."},{h:"Événement contraire",t:"P(non A) = 1 − P(A). Ex. : P(obtenir 6) = 1/6 donc P(ne pas obtenir 6) = 5/6."},{h:"Moyenne",t:"Somme des valeurs ÷ effectif total. Avec coefficients : moyenne pondérée."},{h:"Médiane",t:"Valeur qui partage la série ORDONNÉE en deux groupes de même effectif."},{h:"Étendue",t:"Plus grande valeur − plus petite valeur. Elle mesure la dispersion de la série."}],retenir:"N’oublie pas d’ORDONNER la série avant de chercher la médiane !"}],quiz:[{q:"Un triangle ABC est rectangle en A avec AB = 6 cm et AC = 8 cm. Combien mesure BC ?",o:["10 cm","14 cm","12 cm","√28 cm"],a:0,e:"D’après Pythagore : BC² = 6² + 8² = 36 + 64 = 100, donc BC = √100 = 10 cm."},{q:"Un triangle a pour côtés 5, 12 et 13. Est-il rectangle ?",o:["Oui, car 13² = 5² + 12²","Non, car 13 ≠ 5 + 12","On ne peut pas savoir","Oui, car 5 + 12 > 13"],a:0,e:"13² = 169 et 5² + 12² = 25 + 144 = 169. D’après la réciproque de Pythagore, il est rectangle."},{q:"(MN) // (BC), AM = 2, AB = 6 et BC = 9. Combien mesure MN ?",o:["3","4,5","27","6"],a:0,e:"Thalès : MN/BC = AM/AB donc MN = 9 × 2 ÷ 6 = 3."},{q:"Développer (x + 3)² donne :",o:["x² + 9","x² + 6x + 9","x² + 3x + 9","2x + 6"],a:1,e:"Identité remarquable (a + b)² = a² + 2ab + b² : x² + 2×x×3 + 3² = x² + 6x + 9."},{q:"Quelles sont les solutions de (x − 4)(2x + 6) = 0 ?",o:["4 et 3","−4 et 3","4 et −3","Il n’y en a pas"],a:2,e:"Produit nul : x − 4 = 0 → x = 4, ou 2x + 6 = 0 → x = −3."},{q:"Si f(x) = 3x − 5, quelle est l’image de 4 ?",o:["7","3","−17","12"],a:0,e:"f(4) = 3 × 4 − 5 = 12 − 5 = 7."},{q:"Dans un triangle rectangle, le cosinus d’un angle aigu est égal à :",o:["Opposé / Hypoténuse","Adjacent / Hypoténuse","Opposé / Adjacent","Hypoténuse / Adjacent"],a:1,e:"SOH CAH TOA : Cosinus = Adjacent / Hypoténuse."},{q:"Une urne contient 3 boules rouges et 5 bleues. Quelle est la probabilité de tirer une boule rouge ?",o:["3/5","5/8","3/8","1/3"],a:2,e:"Il y a 3 issues favorables sur 8 boules au total : P = 3/8."},{q:"Quelle est la médiane de la série : 4 ; 9 ; 2 ; 7 ; 5 ?",o:["2","5","5,4","7"],a:1,e:"On ordonne : 2 ; 4 ; 5 ; 7 ; 9. La valeur centrale (3e sur 5) est 5."},{q:"On agrandit une figure à l’échelle 3. Son aire est multipliée par :",o:["3","6","9","27"],a:2,e:"Les aires sont multipliées par k² = 3² = 9 (et les volumes par k³ = 27)."}]},{id:"histoire",name:"Histoire-Géo-EMC",short:"Histoire-Géo",icon:Rf,gradient:"from-amber-500 to-orange-500",soft:"bg-amber-50 text-amber-700 border-amber-200",accent:"text-amber-600",sheets:[{id:"hg-ww2",title:"La Seconde Guerre mondiale (1939-1945)",intro:"Une guerre d’anéantissement, mondiale et totale, marquée par des crimes de masse sans précédent.",points:[{h:"Dates clés",t:"1er sept. 1939 : invasion de la Pologne. Juin 1940 : défaite de la France. 22 juin 1941 : invasion de l’URSS. 7 déc. 1941 : Pearl Harbor. 1942-1943 : Stalingrad (tournant). 6 juin 1944 : débarquement en Normandie. 8 mai 1945 : capitulation allemande. 6 et 9 août 1945 : Hiroshima et Nagasaki. 2 sept. 1945 : capitulation du Japon."},{h:"Une guerre d’anéantissement",t:"Les combats visent à détruire totalement l’ennemi, y compris les civils (bombardements, massacres). Environ 60 millions de morts, dont plus de la moitié de civils."},{h:"Le génocide des Juifs et des Tziganes",t:"Les nazis assassinent environ 6 millions de Juifs : fusillades par les Einsatzgruppen à l’Est (« Shoah par balles »), puis centres de mise à mort (Auschwitz-Birkenau, Treblinka…). Environ 200 000 Tziganes sont aussi exterminés."},{h:"La France dans la guerre",t:"Régime de Vichy (maréchal Pétain) : collaboration avec l’Allemagne, lois antisémites, rafle du Vél d’Hiv (juillet 1942). Résistance : appel du 18 juin 1940 du général de Gaulle, Jean Moulin unifie la Résistance intérieure (CNR, 1943)."}],retenir:"Retiens le vocabulaire : guerre d’anéantissement, génocide, collaboration, Résistance, régime de Vichy, France libre."},{id:"hg-guerrefroide",title:"La Guerre froide (1947-1991)",intro:"Affrontement indirect entre deux superpuissances : les États-Unis et l’URSS, sans conflit armé direct entre elles.",points:[{h:"Deux modèles opposés",t:"États-Unis : démocratie libérale, capitalisme. URSS : régime communiste, parti unique, économie planifiée."},{h:"Débuts (1947)",t:"Doctrine Truman (endiguement du communisme) et plan Marshall face à la doctrine Jdanov. L’Europe est coupée par le « rideau de fer »."},{h:"Berlin, symbole",t:"Blocus de Berlin (1948-1949), construction du Mur en 1961, chute du Mur le 9 novembre 1989."},{h:"Crises majeures",t:"Guerre de Corée (1950-1953), crise des missiles de Cuba (1962) : le monde frôle la guerre nucléaire. Guerre du Vietnam."},{h:"Fin",t:"Effondrement du bloc de l’Est (1989) puis disparition de l’URSS en décembre 1991."}],retenir:"« Guerre froide » = pas d’affrontement direct entre les deux Grands, grâce à l’équilibre de la terreur (dissuasion nucléaire)."},{id:"hg-vrepublique",title:"La Ve République (depuis 1958)",intro:"Fondée en 1958 par le général de Gaulle pendant la guerre d’Algérie, elle renforce le pouvoir exécutif.",points:[{h:"Naissance",t:"Constitution adoptée par référendum le 28 septembre 1958. De Gaulle devient président. En 1962, le président est élu au suffrage universel direct."},{h:"Séparation des pouvoirs",t:"Exécutif : président de la République + gouvernement (Premier ministre). Législatif : Parlement (Assemblée nationale + Sénat). Judiciaire : tribunaux."},{h:"Alternance et cohabitation",t:"1981 : élection de François Mitterrand, première alternance de gauche. Cohabitation : président et Premier ministre de bords politiques opposés (1986, 1993, 1997)."},{h:"Évolution de la société",t:"Mai 1968 ; loi Neuwirth (contraception, 1967) ; majorité à 18 ans (1974) ; loi Veil sur l’IVG (1975) ; abolition de la peine de mort (1981) ; parité (2000)."}],retenir:"Le président est élu pour 5 ans (quinquennat depuis 2002) au suffrage universel direct."},{id:"hg-geo-territoire",title:"Géo : aires urbaines et aménagement du territoire",intro:"Comment le territoire français est-il organisé et aménagé ?",points:[{h:"Aire d’attraction d’une ville",t:"Un pôle (ville-centre + banlieue) et sa couronne (communes dont au moins 15 % des actifs travaillent dans le pôle). Plus de 9 Français sur 10 vivent sous l’influence d’une ville."},{h:"Périurbanisation",t:"Extension des villes vers les campagnes environnantes : maisons individuelles, dépendance à la voiture, étalement urbain."},{h:"Espaces productifs",t:"Industriels, agricoles, touristiques, de services. Ils se métropolisent et s’ouvrent sur le monde (littoraux, grandes métropoles)."},{h:"Aménager le territoire",t:"Actions de l’État, des régions, de l’UE pour réduire les inégalités : transports (LGV), couverture numérique, services publics en zone rurale."},{h:"Outre-mer",t:"Les territoires ultramarins (Guadeloupe, Martinique, Guyane, La Réunion, Mayotte…) font face à des défis spécifiques : éloignement, insularité, risques naturels."}],retenir:"Pour un croquis : titre, légende organisée en parties, figurés clairs (points, flèches, aplats de couleur)."},{id:"hg-emc",title:"EMC : la République et la citoyenneté",intro:"Enseignement moral et civique : valeurs, principes et symboles de la République française.",points:[{h:"Valeurs et principes",t:"Devise : « Liberté, Égalité, Fraternité ». La France est une République indivisible, laïque, démocratique et sociale (article 1 de la Constitution)."},{h:"Symboles",t:"Drapeau tricolore, Marianne, La Marseillaise, le 14 Juillet, le coq gaulois."},{h:"La laïcité",t:"Loi de 1905 : séparation des Églises et de l’État. L’État est neutre ; chacun est libre de croire ou de ne pas croire."},{h:"Être citoyen",t:"Droits (voter dès 18 ans, liberté d’expression) et devoirs (respecter la loi, payer ses impôts, recensement à 16 ans, JDC)."},{h:"Engagement",t:"Associations, service civique, délégués de classe, vote, défense nationale. La Défense participe à la sécurité du pays (armée, gendarmerie)."}],retenir:"Laïcité ≠ interdiction des religions : elle garantit la liberté de conscience et l’égalité de tous les citoyens."}],quiz:[{q:"Quelle bataille marque un tournant de la Seconde Guerre mondiale en 1942-1943 sur le front de l’Est ?",o:["Verdun","Stalingrad","Midway","El-Alamein"],a:1,e:"La victoire soviétique à Stalingrad (février 1943) met fin à l’avancée allemande à l’Est. (Verdun, c’est 1916 !)"},{q:"Quel nom donne-t-on à l’extermination des Juifs d’Europe par les nazis ?",o:["Le Blitzkrieg","La Shoah","Le Front populaire","La guerre totale"],a:1,e:"La Shoah (« catastrophe » en hébreu) désigne le génocide des Juifs : environ 6 millions de victimes."},{q:"Qui lance l’appel du 18 juin 1940 depuis Londres ?",o:["Philippe Pétain","Jean Moulin","Charles de Gaulle","Winston Churchill"],a:2,e:"Le général de Gaulle appelle les Français à poursuivre le combat depuis Londres, sur les ondes de la BBC."},{q:"En quelle année le mur de Berlin tombe-t-il ?",o:["1961","1989","1991","1945"],a:1,e:"Le mur tombe le 9 novembre 1989. Il avait été construit en 1961. L’URSS disparaît en 1991."},{q:"Lors de la crise de Cuba (1962), les États-Unis découvrent :",o:["Des missiles nucléaires soviétiques","Une base chinoise","Un blocus de Berlin","Un sous-marin allemand"],a:0,e:"L’URSS installe des missiles nucléaires à Cuba, à proximité des États-Unis : le monde frôle la guerre nucléaire."},{q:"Depuis 1962, le président de la Ve République est élu :",o:["Par le Parlement","Au suffrage universel indirect","Au suffrage universel direct","Par le Premier ministre"],a:2,e:"Le référendum de 1962 instaure l’élection du président au suffrage universel direct, ce qui renforce sa légitimité."},{q:"Quelle loi de 1975 autorise l’interruption volontaire de grossesse (IVG) ?",o:["La loi Ferry","La loi Veil","La loi Neuwirth","La loi Badinter"],a:1,e:"Portée par Simone Veil, ministre de la Santé, la loi de 1975 dépénalise l’IVG."},{q:"Qu’appelle-t-on la périurbanisation ?",o:["Le déclin des villes","L’extension des villes vers les espaces ruraux voisins","La construction de gratte-ciel","Le retour à l’agriculture"],a:1,e:"La périurbanisation est l’étalement des villes sur les campagnes proches, souvent avec des lotissements de maisons individuelles."},{q:"La loi de séparation des Églises et de l’État date de :",o:["1789","1882","1905","1958"],a:2,e:"La loi du 9 décembre 1905 fonde la laïcité : la République ne reconnaît ni ne finance aucun culte."},{q:"Qu’appelle-t-on une « cohabitation » sous la Ve République ?",o:["Un président et un Premier ministre de bords politiques opposés","Deux présidents en même temps","Un gouvernement d’union nationale","Une fusion de l’Assemblée et du Sénat"],a:0,e:"La cohabitation survient quand la majorité à l’Assemblée est opposée au président (ex. : 1986, 1993, 1997)."}]},{id:"sciences",name:"Sciences",short:"Sciences",icon:zf,gradient:"from-emerald-500 to-teal-500",soft:"bg-emerald-50 text-emerald-700 border-emerald-200",accent:"text-emerald-600",sheets:[{id:"sc-genetique",title:"SVT : Génétique et hérédité",intro:"Chaque individu est unique grâce à son information génétique, portée par l’ADN.",points:[{h:"Chromosomes",t:"Dans le noyau de chaque cellule, l’humain possède 46 chromosomes, soit 23 paires. La 23e paire détermine le sexe (XX = fille, XY = garçon)."},{h:"ADN, gènes, allèles",t:"Un chromosome est formé d’ADN. Un gène est une portion d’ADN qui détermine un caractère (ex. : groupe sanguin). Un gène peut exister sous plusieurs versions : les allèles."},{h:"Mitose",t:"Division d’une cellule en deux cellules-filles identiques avec le même nombre de chromosomes (46). Permet la croissance et le renouvellement."},{h:"Méiose et fécondation",t:"La méiose produit les gamètes (spermatozoïdes, ovules) avec 23 chromosomes. La fécondation réunit 2 gamètes → cellule-œuf à 46 chromosomes, avec une combinaison unique."}],retenir:"Gamètes = 23 chromosomes ; cellules du corps = 46 chromosomes. La fécondation explique la diversité génétique."},{id:"sc-svt-sante",title:"SVT : Système immunitaire & microbes",intro:"Notre organisme se défend contre les micro-organismes pathogènes (bactéries, virus).",points:[{h:"Réaction rapide (innée)",t:"La phagocytose : des globules blancs (phagocytes) englobent et digèrent les microbes. Elle provoque l’inflammation (rougeur, chaleur, gonflement)."},{h:"Réaction adaptative",t:"Les lymphocytes B produisent des anticorps spécifiques qui neutralisent un antigène précis. Les lymphocytes T tuent les cellules infectées."},{h:"Mémoire immunitaire",t:"Après un premier contact, des lymphocytes mémoire permettent une réponse plus rapide et plus forte. C’est le principe de la vaccination."},{h:"Antibiotiques",t:"Ils agissent contre les bactéries, mais PAS contre les virus. Leur mauvais usage favorise la résistance des bactéries."}],retenir:"Vaccin = prévention (mémoire immunitaire). Antibiotique = traitement contre les bactéries uniquement."},{id:"sc-energie",title:"Physique : Énergie, puissance, électricité",intro:"L’énergie se conserve : elle se transforme d’une forme à une autre.",points:[{h:"Formes d’énergie",t:"Cinétique (mouvement), potentielle (position), thermique, électrique, chimique, lumineuse, nucléaire."},{h:"Énergie cinétique",t:"Ec = ½ × m × v² (m en kg, v en m/s, Ec en joules J). Doubler la vitesse multiplie l’énergie par 4 : importance pour la sécurité routière !"},{h:"Puissance électrique",t:"P = U × I (P en watts W, U en volts V, I en ampères A)."},{h:"Énergie électrique",t:"E = P × t (E en joules si t en secondes ; en Wh si t en heures). 1 kWh = 3 600 000 J."},{h:"Loi d’Ohm",t:"U = R × I (R résistance en ohms Ω)."}],retenir:"Convertis TOUJOURS les unités avant de calculer (km/h → m/s : diviser par 3,6)."},{id:"sc-chimie",title:"Chimie : Atomes, ions et pH",intro:"La matière est constituée d’atomes, eux-mêmes formés d’un noyau et d’électrons.",points:[{h:"Structure de l’atome",t:"Noyau (protons chargés + et neutrons neutres) entouré d’électrons (chargés −). Un atome est électriquement neutre : autant de protons que d’électrons."},{h:"Les ions",t:"Un ion est un atome qui a gagné ou perdu des électrons. Cation (positif, a perdu des e⁻) ex. Na⁺ ; anion (négatif, a gagné des e⁻) ex. Cl⁻."},{h:"Le pH",t:"pH < 7 : solution acide (ions H⁺ majoritaires) ; pH = 7 : neutre ; pH > 7 : basique (ions HO⁻ majoritaires)."},{h:"Transformation chimique",t:"Des réactifs disparaissent, des produits se forment. Conservation des atomes et de la masse (Lavoisier : « Rien ne se perd… »)."}],retenir:"Tests d’ions : Cu²⁺ → précipité bleu ; Fe²⁺ → vert ; Fe³⁺ → rouille (avec la soude) ; Cl⁻ → précipité blanc (nitrate d’argent)."},{id:"sc-techno",title:"Technologie : Objets techniques et programmation",intro:"Analyser le fonctionnement d’un objet technique et comprendre un programme.",points:[{h:"Chaîne d’information",t:"ACQUÉRIR (capteurs : bouton, détecteur de lumière…) → TRAITER (microcontrôleur, carte programmable) → COMMUNIQUER (écran, LED, signal)."},{h:"Chaîne d’énergie",t:"ALIMENTER (pile, secteur) → DISTRIBUER (interrupteur, relais) → CONVERTIR (moteur) → TRANSMETTRE (engrenages, courroie)."},{h:"Algorithme",t:"Suite d’instructions pour résoudre un problème. Structures : séquence, boucle (répéter, tant que), condition (si… alors… sinon)."},{h:"Variables",t:"Une variable stocke une valeur qui peut changer (ex. : score, température). Sous Scratch : « mettre score à 0 », « ajouter 1 à score »."}],retenir:"Capteur = acquérir une information ; actionneur = agir (moteur, lampe, buzzer)."}],quiz:[{q:"Combien de chromosomes contient une cellule humaine (hors gamètes) ?",o:["23","46","44","92"],a:1,e:"Une cellule humaine contient 46 chromosomes (23 paires). Les gamètes n’en contiennent que 23."},{q:"Qu’est-ce qu’un allèle ?",o:["Un chromosome sexuel","Une version d’un gène","Un type de cellule","Une division cellulaire"],a:1,e:"Un gène peut exister en plusieurs versions appelées allèles (ex. : allèles A, B, O pour le groupe sanguin)."},{q:"Les antibiotiques sont efficaces contre :",o:["Les virus","Les bactéries","Les virus et les bactéries","Les allergies"],a:1,e:"Les antibiotiques n’agissent que sur les bactéries. Ils sont inutiles contre les virus (grippe, rhume…)."},{q:"Sur quel principe repose la vaccination ?",o:["La phagocytose","La mémoire immunitaire","La méiose","La photosynthèse"],a:1,e:"Le vaccin fait produire des lymphocytes mémoire : en cas de vraie infection, la réponse est rapide et efficace."},{q:"Une lampe fonctionne sous 230 V avec une intensité de 0,5 A. Sa puissance vaut :",o:["460 W","115 W","230,5 W","0,002 W"],a:1,e:"P = U × I = 230 × 0,5 = 115 W."},{q:"Si la vitesse d’un véhicule double, son énergie cinétique est :",o:["Doublée","Inchangée","Multipliée par 4","Divisée par 2"],a:2,e:"Ec = ½ m v² : la vitesse est au carré, donc si v est multipliée par 2, Ec est multipliée par 2² = 4."},{q:"Une solution de pH = 3 est :",o:["Neutre","Basique","Acide","Impossible"],a:2,e:"Un pH inférieur à 7 indique une solution acide (ex. : jus de citron, vinaigre)."},{q:"L’ion Na⁺ est :",o:["Un anion, il a gagné un électron","Un cation, il a perdu un électron","Un atome neutre","Un cation, il a gagné un proton"],a:1,e:"La charge + signifie que l’atome de sodium a PERDU un électron : c’est un cation."},{q:"Dans la chaîne d’information, un capteur de luminosité sert à :",o:["Traiter","Acquérir","Communiquer","Convertir"],a:1,e:"Un capteur ACQUIERT une information (ici, la luminosité) qui sera ensuite traitée par le microcontrôleur."},{q:"Dans un programme, « répéter 10 fois » est :",o:["Une condition","Une variable","Une boucle","Un capteur"],a:2,e:"« Répéter » est une boucle : elle exécute plusieurs fois les mêmes instructions."}]},{id:"oral",name:"Oral du Brevet",short:"Oral",icon:Us,gradient:"from-violet-500 to-purple-500",soft:"bg-violet-50 text-violet-700 border-violet-200",accent:"text-violet-600",sheets:[{id:"or-deroule",title:"Le déroulement de l’épreuve",intro:"L’oral est noté sur 100 points. Il évalue ta capacité à exposer un projet et à argumenter.",points:[{h:"Durée",t:"15 minutes au total : 5 minutes d’exposé + 10 minutes d’entretien avec le jury (en individuel). En groupe (jusqu’à 3 élèves) : 10 min d’exposé + 15 min d’entretien."},{h:"Le jury",t:"Généralement 2 professeurs de ton collège. Ils ne sont pas forcément spécialistes de ton sujet : explique clairement !"},{h:"Le sujet",t:"Un projet mené en histoire des arts, dans un EPI, ou dans le cadre d’un parcours (Avenir, citoyen, éducation artistique et culturelle, santé)."},{h:"Les supports",t:"Tu peux t’appuyer sur un support (diaporama, objet, affiche), mais il ne doit pas être lu. Tu peux présenter une partie en langue étrangère."}],retenir:"Ce n’est pas une récitation : le jury évalue surtout ton aisance, ta réflexion et ta capacité à répondre aux questions."},{id:"or-structure",title:"Construire un exposé efficace",intro:"5 minutes, c’est court : chaque phrase compte ! Voici une structure qui marche.",points:[{h:"Introduction (≈ 45 s)",t:"Salue le jury, présente-toi, annonce ton sujet avec une accroche (citation, question, anecdote), puis ta problématique et ton plan."},{h:"Développement (≈ 3 min 30)",t:"2 ou 3 parties : présentation du projet/de l’œuvre, ce que tu as fait (démarche, difficultés), ce que tu as appris (compétences, liens avec d’autres matières)."},{h:"Conclusion (≈ 45 s)",t:"Réponds à ta problématique, fais un bilan personnel (ce que ce projet t’a apporté) et propose une ouverture."},{h:"Les fiches",t:"Utilise de petites fiches avec des mots-clés, pas des phrases entières. Numérote-les !"}],retenir:"Entraîne-toi à voix haute avec un chronomètre : vise 4 min 45 pour garder une marge."},{id:"or-criteres",title:"Les critères de notation",intro:"La note sur 100 points se répartit généralement en deux grands axes.",points:[{h:"Maîtrise de l’expression orale (50 pts)",t:"Voix audible, débit adapté, vocabulaire précis, regard vers le jury, posture, gestion du temps."},{h:"Maîtrise du sujet (50 pts)",t:"Clarté de la présentation, qualité de l’argumentation, capacité à prendre du recul et à répondre aux questions."},{h:"Les bonnes attitudes",t:"Se tenir droit, sourire, regarder les deux membres du jury, ne pas croiser les bras, ne pas mâcher de chewing-gum."},{h:"Les pièges à éviter",t:"Lire ses notes, parler trop vite, répondre « je ne sais pas » sans chercher, tenue négligée, arriver en retard."}],retenir:"Si tu ne connais pas une réponse, reformule la question et propose une piste de réflexion : le jury valorise ton raisonnement."},{id:"or-stress",title:"Gérer son stress le jour J",intro:"Le stress est normal, il peut même t’aider à être concentré. Voici comment le maîtriser.",points:[{h:"La veille",t:"Prépare ta tenue, tes supports, ta convocation et ta pièce d’identité. Couche-toi tôt, évite les écrans tard."},{h:"La respiration",t:"Technique 4-4-4 : inspire 4 secondes, bloque 4 secondes, expire 4 secondes. Répète 3 fois avant d’entrer."},{h:"En cas de trou de mémoire",t:"Fais une pause, regarde ta fiche, reprends ta dernière idée ou passe à la partie suivante. Le jury est bienveillant."},{h:"S’entraîner",t:"Présente ton exposé à ta famille, tes amis, ou enregistre-toi en vidéo pour repérer tes tics de langage (« euh », « du coup »)."}],retenir:"Plus tu t’entraînes, plus tu seras à l’aise : la répétition est la meilleure arme anti-stress !"}],quiz:[{q:"Quelle est la durée de l’oral individuel du Brevet ?",o:["10 minutes","15 minutes (5 + 10)","30 minutes","5 minutes"],a:1,e:"L’oral individuel dure 15 minutes : 5 minutes d’exposé suivies de 10 minutes d’entretien avec le jury."},{q:"Sur combien de points l’oral est-il noté ?",o:["50 points","100 points","200 points","20 points"],a:1,e:"L’oral est noté sur 100 points, autant que le français ou les mathématiques !"},{q:"Quelle attitude faut-il adopter face au jury ?",o:["Lire son texte pour ne rien oublier","Regarder le jury et parler clairement","Parler très vite pour tout dire","Fixer le plafond"],a:1,e:"Regarder le jury, parler distinctement et à un rythme posé montrent ton aisance à l’oral."},{q:"Que faire si tu ne connais pas la réponse à une question ?",o:["Dire « je ne sais pas » et se taire","Inventer n’importe quoi","Reformuler et proposer une piste de réflexion","Changer de sujet"],a:2,e:"Le jury valorise ta capacité à réfléchir. Reformule la question et propose ce que tu penses, même partiellement."},{q:"Sur quoi peut porter le sujet de l’oral ?",o:["Uniquement sur un livre lu en classe","Un projet d’histoire des arts, d’EPI ou d’un parcours éducatif","Un sujet tiré au sort le jour J","Une question de mathématiques"],a:1,e:"Tu présentes un projet mené en histoire des arts, en EPI ou dans un parcours (Avenir, citoyen, santé, artistique et culturel)."},{q:"Quels documents faut-il prévoir pour les fiches de l’exposé ?",o:["Un texte entièrement rédigé","Des fiches avec des mots-clés","Aucune fiche","Le manuel scolaire"],a:1,e:"Des fiches avec des mots-clés t’aident sans te pousser à lire. Le jury veut t’entendre parler, pas réciter."},{q:"Peut-on présenter une partie de son oral en langue étrangère ?",o:["Non, c’est interdit","Oui, c’est possible","Oui, mais uniquement en latin","Seulement en groupe"],a:1,e:"Oui, une partie de la présentation peut se faire en langue vivante étrangère (ou régionale) étudiée au collège."},{q:"Quelle technique aide à gérer le stress avant d’entrer ?",o:["Boire un soda","La respiration lente et contrôlée","Réviser tout le cours à la dernière minute","Parler fort dans le couloir"],a:1,e:"La respiration lente (ex. 4-4-4) fait baisser le rythme cardiaque et aide à se recentrer."}]}],Sr=["Pourquoi as-tu choisi ce sujet ?","Quelles difficultés as-tu rencontrées et comment les as-tu surmontées ?","Qu’as-tu appris grâce à ce projet ?","Si tu devais refaire ce projet, que changerais-tu ?","Quel lien fais-tu entre ce projet et d’autres matières ?","Comment as-tu organisé ton travail (seul·e ou en groupe) ?","Quelles sources as-tu utilisées ? Comment as-tu vérifié leur fiabilité ?","En quoi ce projet t’aide-t-il à réfléchir à ton orientation ?","Peux-tu définir précisément ce terme que tu as employé ?","Quelle partie du projet as-tu préférée, et pourquoi ?","Ce sujet a-t-il un lien avec l’actualité ?","Quel message l’artiste (ou l’œuvre) cherche-t-il à transmettre selon toi ?","Quelles compétences as-tu développées pendant ce projet ?","Comment ce projet a-t-il changé ton regard sur le sujet ?","Que conseillerais-tu à un élève qui voudrait mener un projet similaire ?"],Hf=["Langue française (oral et écrit)","Langues étrangères et régionales","Langages mathématiques, scientifiques et informatiques","Langages des arts et du corps","Méthodes et outils pour apprendre","Formation de la personne et du citoyen","Syst
